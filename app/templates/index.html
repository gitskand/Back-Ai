<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Talk To Me</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/static/img/icons8-internet-100.png">

  <!-- Styles -->
  <link rel="stylesheet" href="/static/css/style.css">

  <style>
    /* ✅ Clear Chat Button */
    #clearChatBtn {
      display: block;
      margin: 10px auto;
      padding: 8px 20px;
      background: #ff4d4f;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    #clearChatBtn:hover {
      background: #e04344;
      transform: translateY(-1px);
    }

    /* 👻 Hide send + stop by default */
    #send, #stopVoice {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    /* ✨ Show when active */
    #send.active, #stopVoice.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* ✅ WhatsApp-style send button */
    .send-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.25s ease, transform 0.1s ease;
    }

    body:not(.light) .send-btn {
      background: #25D366;
      color: #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    body:not(.light) .send-btn:hover {
      background: #20ba5a;
      transform: translateY(-2px);
    }

    body.light .send-btn {
      background: #075E54;
      color: #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    body.light .send-btn:hover {
      background: #0a7c6d;
      transform: translateY(-2px);
    }

    /* ✅ Scrollable chat area */
    #chat {
      height: 70vh;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 10px;
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark app-header">
      <a class="navbar-brand brand" href="#">FriendlyTalk - <span>AI</span></a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <div class="ml-auto controls toolbar d-flex align-items-center flex-wrap">
          <label class="ctrl mr-2">
            <span class="lbl">Persona</span>
            <select id="identity" class="form-control form-control-sm">
              <option value="neutral">Neutral</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </label>

          <label class="ctrl mr-2">
            <span class="lbl">Voice</span>
            <select id="voiceSelect" class="form-control form-control-sm"></select>
          </label>

          <label class="ctrl mr-2">
            <span class="lbl">Accent</span>
            <select id="langSelect" class="form-control form-control-sm">
              <option value="en-IN">English (India)</option>
              <option value="en-US">English (US)</option>
              <option value="en-GB">English (UK)</option>
              <option value="en-AU">English (Australia)</option>
            </select>
          </label>

          <button id="themeToggle" class="btn btn-outline-light btn-sm" title="Toggle dark/light">🌙</button>
        </div>
      </div>
    </nav>

    <!-- Chat Window -->
    <main id="chat" class="chat-window">
      <div class="bubble ai bub">
        <div class="avatar bck-color" id="avatar">
          <img src="/static/img/avatar-neutral.jpeg" alt="AI">
        </div>
        <div class="text tst-color">
          Hello! I’m FriendlyTalk AI. Pick a persona, type or hold mic to speak, and I’ll reply with voice.
        </div>
      </div>
    </main>

    <!-- ✅ Clear Chat Button -->
    <button id="clearChatBtn" onclick="clearChat()">🧹 Clear Chat</button>

    <!-- Footer -->
    <footer class="app-footer">
      <input id="nameInput" placeholder="Name" />
      <div class="msg-area">
        <input id="msg" class="hu" data-short-placeholder="..." placeholder="Type a message..." />
        <button id="toggleMic" class="mic-inside" title="Hold to talk">🎙️</button>
      </div>

      <button id="send" class="send-btn" title="Send message">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>

      <button id="stopVoice" class="stop-btn" title="Stop speaking">⏹️</button>
    </footer>

  </div>

  <!-- JS -->
  <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"></script>
  <script src="/static/js/app.js"></script>

  <script>
    // 🌙 Theme toggle
    document.addEventListener("DOMContentLoaded", () => {
      const themeBtn = document.getElementById('themeToggle');
      themeBtn.addEventListener('click', () => {
        document.body.classList.toggle('light');
        themeBtn.textContent = document.body.classList.contains('light') ? '🌙' : '☀️';
      });

      const msgInput = document.getElementById("msg");
      const sendBtn = document.getElementById("send");
      const stopBtn = document.getElementById("stopVoice");
      const micBtn = document.getElementById("toggleMic");

      // ✉️ Show/hide send + stop + mic
      msgInput.addEventListener("input", () => {
        const hasText = msgInput.value.trim().length > 0;
        sendBtn.classList.toggle("active", hasText);
        stopBtn.classList.toggle("active", hasText);
        micBtn.style.opacity = hasText ? "0" : "1";
        micBtn.style.pointerEvents = hasText ? "none" : "auto";
      });

      // ↩️ Enter to send (Shift+Enter = newline)
      msgInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendBtn.click();
        }
      });

      // 📱 Responsive placeholder
      function updatePlaceholder() {
        if (window.innerWidth < 480) {
          msgInput.setAttribute("placeholder", msgInput.getAttribute("data-short-placeholder"));
        } else {
          msgInput.setAttribute("placeholder", "Type a message...");
        }
      }
      updatePlaceholder();
      window.addEventListener("resize", updatePlaceholder);
    });

    // 🧹 Clear chat function
    function clearChat() {
      localStorage.removeItem('chatMessages');
      document.getElementById("chat").innerHTML = "";
    }

    // 💾 Restore messages on load
    window.addEventListener('DOMContentLoaded', () => {
      const savedMessages = JSON.parse(localStorage.getItem('chatMessages') || '[]');
      savedMessages.forEach(msg => addBubble(msg.text, msg.who));
    });

    // 🧠 Save message
    function saveMessageToStorage(text, who) {
      const messages = JSON.parse(localStorage.getItem('chatMessages') || '[]');
      messages.push({ text, who });
      localStorage.setItem('chatMessages', JSON.stringify(messages));
    }
  </script>
</body>
</html>
